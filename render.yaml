# Crear/sincronizar este Blueprint inicia el primer despliegue: hacerlo solo con autorizacion.
services:
  - type: web
    name: turnosmart-backend-demo
    runtime: node
    plan: free
    region: virginia
    # Sin rootDir: Root Directory es la raiz del monorepo, no apps/backend.
    buildCommand: npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: HUSKY
        value: '0'
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
