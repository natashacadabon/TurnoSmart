name: TurnoSmart CI

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-powershell:
    name: Backup PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Hosted runners must provide pwsh 7.4+; absence fails the job, never skips tests.
      - name: Verify PowerShell and Node prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4+ required' }
          if ((node -p 'process.versions.node.split(".")[0]') -ne '22') { throw 'Node.js 22.x required' }

      - name: Install dependencies
        run: npm ci

      - name: Test portable Node.js backup checks
        run: npm run test:backup

      - name: Test PowerShell wrappers and protected backup operations
        run: npm run test:backup:powershell

  quality:
    name: Quality Checks
    needs: backup-powershell
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Keep the existing quality gate red if any mandatory wrapper job fails.
      - name: Require PowerShell checks
        shell: bash
        env:
          BACKUP_CHECK_RESULT: ${{ needs.backup-powershell.result }}
        run: test "$BACKUP_CHECK_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      # Schema validation and client generation do not connect to a database.
      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace=apps/backend
        env:
          DATABASE_URL: postgresql://prisma-schema-check@127.0.0.1:1/turnosmart
          DIRECT_URL: postgresql://prisma-schema-check@127.0.0.1:1/turnosmart

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=apps/backend
        env:
          DATABASE_URL: postgresql://prisma-schema-check@127.0.0.1:1/turnosmart
          DIRECT_URL: postgresql://prisma-schema-check@127.0.0.1:1/turnosmart

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: |
          npm test
          npm run test:config --workspace=apps/frontend

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: apps/frontend/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node22-next-v1-${{ hashFiles('package-lock.json') }}-${{ hashFiles('package.json', 'apps/frontend/src/**', 'apps/frontend/scripts/**', 'apps/frontend/*.json', 'apps/frontend/next.config.*', 'packages/shared/src/**', 'packages/shared/*.json', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node22-next-v1-${{ hashFiles('package-lock.json') }}-

      - name: Build backend
        run: npm run build --workspace=apps/backend

      - name: Build frontend for CI
        run: npm run build --workspace=apps/frontend
        env:
          NEXT_PUBLIC_USE_AZURE: 'false'
          NEXT_PUBLIC_API_URL_RENDER: https://turnosmart-render.invalid
          NEXT_PUBLIC_API_URL_AZURE: https://turnosmart-azure.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_build_only
