name: TurnoSmart CI

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace=apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turnosmart
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/turnosmart

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turnosmart
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/turnosmart

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: |
          npm test
          npm run test:config --workspace=apps/frontend

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_USE_AZURE: 'false'
          NEXT_PUBLIC_API_URL_RENDER: https://turnosmart-render.invalid
          NEXT_PUBLIC_API_URL_AZURE: https://turnosmart-azure.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_build_only
