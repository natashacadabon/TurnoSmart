name: Frontend preview

# workflow_run usa esta definicion desde la rama por defecto, no la de la PR.
# El codigo de la PR solo corre en el job build, que no recibe secretos.
on:
  workflow_run:
    workflows: [TurnoSmart CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  select:
    if: >-
      ${{ vars.VERCEL_CD_ENABLED == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.select.outputs.pr }}
      sha: ${{ steps.select.outputs.sha }}
      branch: ${{ steps.select.outputs.branch }}
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select eligible PR
        id: select
        uses: actions/github-script@v8
        with:
          script: |
            const { selectPreview } = await import(`${process.env.GITHUB_WORKSPACE}/apps/frontend/scripts/deploy-config.mjs`);
            const preview = await selectPreview(github, context);
            if (!preview) return core.info('Sin Preview para esta revision.');
            const pr = preview.payload.pull_request;
            core.setOutput('pr', pr.number);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('branch', pr.head.ref);

  # Unico paso con secretos antes del build: solo ejecuta codigo confiable y
  # entrega al build los valores publicos NEXT_PUBLIC_* ya validados.
  settings:
    needs: select
    if: needs.select.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vercel-preview
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_TARGET: preview
      VERCEL_CLI_VERSION: '65.9.0'
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pull and sanitize Vercel settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HEAD_REF: ${{ needs.select.outputs.branch }}
          EXPECTED_DEV_API: ${{ vars.EXPECTED_DEV_API }}
          EXPECTED_DEV_SUPABASE: ${{ vars.EXPECTED_DEV_SUPABASE }}
        run: |
          : "${VERCEL_TOKEN:?Configurar VERCEL_TOKEN}" "${VERCEL_ORG_ID:?Configurar VERCEL_ORG_ID}" "${VERCEL_PROJECT_ID:?Configurar VERCEL_PROJECT_ID}"
          # Vercel puede tratar el primer deployment de un proyecto como Production.
          scope=()
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            scope=(--data-urlencode "teamId=$VERCEL_ORG_ID")
          fi
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" \
            --get https://api.vercel.com/v7/deployments \
            "${scope[@]}" --data-urlencode "projectId=$VERCEL_PROJECT_ID" \
            --data-urlencode target=production --data-urlencode state=READY --data-urlencode limit=1 |
            jq -e '.deployments | any(.target == "production" and .state == "READY")' >/dev/null ||
            { echo "Preview requiere un deployment Production previo y listo."; exit 1; }
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=preview --git-branch "$HEAD_REF" --token="$VERCEL_TOKEN"
          node apps/frontend/scripts/deploy-config.mjs prepare
          # vercel pull guarda secretos (p. ej. VERCEL_OIDC_TOKEN); prepare los descarta y aqui se exige.
          for file in .vercel/.env.preview.local apps/frontend/.vercel/.env.preview.local; do
            ! grep -qvE '^NEXT_PUBLIC_[A-Z_]+="[^"]*"$' "$file" || { echo "Settings con valores no publicos: $file"; exit 1; }
          done

      - name: Upload sanitized settings
        uses: actions/upload-artifact@v7
        with:
          name: vercel-settings
          path: |
            .vercel/project.json
            .vercel/.env.preview.local
            apps/frontend/.vercel/.env.preview.local
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Unico job que ejecuta codigo de la PR. Sin environment, secretos ni credenciales git.
  build:
    needs: [select, settings]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERCEL_CLI_VERSION: '65.9.0'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Download sanitized settings
        uses: actions/download-artifact@v8
        with:
          name: vercel-settings
          path: .

      - name: Build and verify prebuilt
        run: |
          set -a
          # shellcheck source=/dev/null
          source .vercel/.env.preview.local
          set +a
          npx --yes "vercel@$VERCEL_CLI_VERSION" build --output .vercel/output
          npm run verify:public-build --workspace=apps/frontend
          node apps/frontend/scripts/deploy-config.mjs output

      - name: Upload prebuilt output
        uses: actions/upload-artifact@v7
        with:
          name: vercel-output
          path: .vercel/output
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Recibe secretos pero solo ejecuta scripts del checkout confiable; el artefacto
  # de la PR se trata como datos y se sube con el proyecto y la PR resueltos aqui.
  deploy:
    needs: [select, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vercel-preview
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_TARGET: preview
      VERCEL_CLI_VERSION: '65.9.0'
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download prebuilt output
        uses: actions/download-artifact@v8
        with:
          name: vercel-output
          path: .vercel/output

      - name: Check current revision
        uses: actions/github-script@v8
        with:
          script: |
            const { selectPreview, assertCurrentRevision } = await import(`${process.env.GITHUB_WORKSPACE}/apps/frontend/scripts/deploy-config.mjs`);
            const preview = await selectPreview(github, context);
            if (preview?.payload.pull_request.number !== Number(process.env.PR_NUMBER) || preview.sha !== process.env.PR_SHA)
              throw new Error('Preview obsoleta: ejecutar CI para la revision actual del PR.');
            await assertCurrentRevision(github, preview);
        env:
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          PR_SHA: ${{ needs.select.outputs.sha }}

      - name: Upload prebuilt
        id: upload
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          PR_SHA: ${{ needs.select.outputs.sha }}
        run: |
          : "${VERCEL_TOKEN:?Configurar VERCEL_TOKEN}" "${VERCEL_ORG_ID:?Configurar VERCEL_ORG_ID}" "${VERCEL_PROJECT_ID:?Configurar VERCEL_PROJECT_ID}"
          url=$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --yes \
            --meta "turnosmartPullRequest=$GITHUB_REPOSITORY_ID-$PR_NUMBER" \
            --meta "turnosmartMergeSha=$PR_SHA" --token="$VERCEL_TOKEN")
          [[ "$url" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app/?$ ]]
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Update verified PR alias
        id: pr-alias
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_URL: ${{ steps.upload.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          script: |
            const { selectPreview } = await import(`${process.env.GITHUB_WORKSPACE}/apps/frontend/scripts/deploy-config.mjs`);
            const { assignPreviewAlias } = await import(`${process.env.GITHUB_WORKSPACE}/apps/frontend/scripts/preview-alias.mjs`);
            const preview = await selectPreview(github, context);
            if (!preview) throw new Error('Preview obsoleta: ejecutar CI para la revision actual del PR.');
            core.setOutput('url', await assignPreviewAlias(github, preview, process.env));

      - name: Report deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.upload.outputs.url }}
          STABLE_PREVIEW_URL: ${{ steps.pr-alias.outputs.url }}
        run: |
          echo "Frontend (preview): $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview estable de la PR: $STABLE_PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
