name: Frontend preview

# workflow_run usa esta definicion desde la rama por defecto, no la de la PR.
# El codigo de la PR solo corre en el job build, que no recibe secretos.
on:
  workflow_run:
    workflows: [TurnoSmart CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  select:
    if: >-
      ${{ vars.VERCEL_CD_ENABLED == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event.workflow_run.event == 'pull_request' ||
           (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'dev')) &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      pr: ${{ steps.select.outputs.pr }}
      sha: ${{ steps.select.outputs.sha }}
      branch: ${{ steps.select.outputs.branch }}
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select eligible revision
        id: select
        uses: actions/github-script@v8
        with:
          script: |
            const { selectFrontendPreview } = await import(`${process.env.GITHUB_WORKSPACE}/apps/frontend/scripts/deploy-config.mjs`);
            const preview = await selectFrontendPreview(github, context);
            if (!preview) return core.info('Sin Preview para esta revision.');
            const pr = preview.payload.pull_request;
            core.setOutput('pr', pr?.number ?? '');
            core.setOutput('sha', preview.sha);
            core.setOutput('branch', pr?.head.ref ?? 'dev');

  # Unico paso con secretos antes del build: solo ejecuta codigo confiable y
  # entrega al build los valores publicos NEXT_PUBLIC_* ya validados.
  settings:
    needs: select
    if: needs.select.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vercel-preview
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_TARGET: preview
      VERCEL_CLI_VERSION: '65.9.0'
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pull and sanitize Vercel settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HEAD_REF: ${{ needs.select.outputs.branch }}
          EXPECTED_DEV_API: ${{ vars.EXPECTED_DEV_API }}
          EXPECTED_DEV_SUPABASE: ${{ vars.EXPECTED_DEV_SUPABASE }}
        run: |
          : "${VERCEL_TOKEN:?Configurar VERCEL_TOKEN}" "${VERCEL_ORG_ID:?Configurar VERCEL_ORG_ID}" "${VERCEL_PROJECT_ID:?Configurar VERCEL_PROJECT_ID}"
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=preview --git-branch "$HEAD_REF" --token="$VERCEL_TOKEN"
          node apps/frontend/scripts/deploy-config.mjs prepare
          # vercel pull guarda secretos (p. ej. VERCEL_OIDC_TOKEN); prepare los descarta y aqui se exige.
          for file in .vercel/.env.preview.local apps/frontend/.vercel/.env.preview.local; do
            ! grep -qvE '^NEXT_PUBLIC_[A-Z_]+="[^"]*"$' "$file" || { echo "Settings con valores no publicos: $file"; exit 1; }
          done

      - name: Upload sanitized settings
        uses: actions/upload-artifact@v7
        with:
          name: vercel-settings
          path: |
            .vercel/project.json
            .vercel/.env.preview.local
            apps/frontend/.vercel/.env.preview.local
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Unico job que ejecuta codigo de la PR. Sin environment, secretos ni credenciales git.
  build:
    needs: [select, settings]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERCEL_CLI_VERSION: '65.9.0'
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Download sanitized settings
        uses: actions/download-artifact@v8
        with:
          name: vercel-settings
          path: .

      - name: Build and verify prebuilt
        run: |
          set -a
          # shellcheck source=/dev/null
          source .vercel/.env.preview.local
          set +a
          npx --yes "vercel@$VERCEL_CLI_VERSION" build --standalone --output .vercel/output
          npm run verify:public-build --workspace=apps/frontend
          node apps/frontend/scripts/deploy-config.mjs output
          node apps/frontend/scripts/deploy-config.mjs standalone-output

      - name: Upload prebuilt output
        uses: actions/upload-artifact@v7
        with:
          name: vercel-output
          path: .vercel/output
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Recibe secretos pero solo ejecuta scripts del checkout confiable; el artefacto
  # de la PR se trata como datos y se sube con el proyecto y la PR resueltos aqui.
  deploy:
    needs: [select, build]
    concurrency:
      group: vercel-preview-mutation-${{ needs.select.outputs.pr || 'dev' }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vercel-preview
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_TARGET: preview
      VERCEL_CLI_VERSION: '65.9.0'
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download prebuilt output
        uses: actions/download-artifact@v8
        with:
          name: vercel-output
          path: .vercel/output

      - name: Validate downloaded prebuilt output
        run: node apps/frontend/scripts/deploy-config.mjs standalone-output

      - name: Check current revision
        id: revision
        uses: actions/github-script@v8
        with:
          script: |
            const { selectFrontendPreview, assertCurrentRevision } = await import(`${process.env.GITHUB_WORKSPACE}/apps/frontend/scripts/deploy-config.mjs`);
            const preview = await selectFrontendPreview(github, context);
            if (!preview || String(preview.payload.pull_request?.number ?? '') !== process.env.PR_NUMBER || preview.sha !== process.env.PR_SHA)
              throw new Error('Preview obsoleta: ejecutar CI para la revision actual.');
            await assertCurrentRevision(github, preview);
            if (preview.eventName === 'push') {
              const { assignPreviewAlias } = await import(`${process.env.GITHUB_WORKSPACE}/apps/frontend/scripts/preview-alias.mjs`);
              core.setOutput('existing', (await assignPreviewAlias(github, preview, process.env)) ?? '');
            }
        env:
          VERCEL_TOKEN: ${{ github.event.workflow_run.event == 'push' && secrets.VERCEL_TOKEN || '' }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          PR_SHA: ${{ needs.select.outputs.sha }}

      - name: Upload prebuilt
        id: upload
        if: steps.revision.outputs.existing == ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          PR_SHA: ${{ needs.select.outputs.sha }}
        run: |
          : "${VERCEL_TOKEN:?Configurar VERCEL_TOKEN}" "${VERCEL_ORG_ID:?Configurar VERCEL_ORG_ID}" "${VERCEL_PROJECT_ID:?Configurar VERCEL_PROJECT_ID}"
          identity="turnosmartDevRepository=$GITHUB_REPOSITORY_ID"
          if [[ -n "$PR_NUMBER" ]]; then
            identity="turnosmartPullRequest=$GITHUB_REPOSITORY_ID-$PR_NUMBER"
          fi
          url=$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --yes --environment=preview \
            --meta "$identity" \
            --meta "turnosmartMergeSha=$PR_SHA" --token="$VERCEL_TOKEN")
          [[ "$url" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app/?$ ]]
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Update verified Preview alias
        id: preview-alias
        if: steps.revision.outputs.existing == ''
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_URL: ${{ steps.upload.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          script: |
            const { selectFrontendPreview } = await import(`${process.env.GITHUB_WORKSPACE}/apps/frontend/scripts/deploy-config.mjs`);
            const { assignPreviewAlias } = await import(`${process.env.GITHUB_WORKSPACE}/apps/frontend/scripts/preview-alias.mjs`);
            const preview = await selectFrontendPreview(github, context);
            if (!preview) throw new Error('Preview obsoleta: ejecutar CI para la revision actual del PR.');
            core.setOutput('url', await assignPreviewAlias(github, preview, process.env));

      - name: Report deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.upload.outputs.url }}
          STABLE_PREVIEW_URL: ${{ steps.preview-alias.outputs.url || steps.revision.outputs.existing }}
        run: |
          echo "Frontend (preview): $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview estable: $STABLE_PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
