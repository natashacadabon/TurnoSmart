# A07: deploy manual del frontend. Nunca se dispara por push.
# Vercel Hobby solo con elegibilidad confirmada; si no cumple, detener y acordar destino.
# Azure bloqueado hasta validar infraestructura, ZIP standalone y startup.
# B es responsable de los workflows: este archivo se integra con el CD de B08.
name: Frontend deploy (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Proveedor de API del frontend
        type: choice
        options: [render, azure]
        required: true
      frontend_target:
        description: Destino de publicacion del frontend
        type: choice
        options: [vercel, azure]
        required: true
      api_url_render:
        description: Origen HTTPS de Render (NEXT_PUBLIC_API_URL_RENDER)
        required: true
      api_url_azure:
        description: Origen HTTPS de Azure (NEXT_PUBLIC_API_URL_AZURE)
        required: true
      hobby_eligible:
        description: Confirmo uso personal no comercial y elegibilidad Hobby (solo frontend_target vercel)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Bloquear Azure y confirmar Hobby
        env:
          FRONTEND_TARGET: ${{ inputs.frontend_target }}
          HOBBY_ELIGIBLE: ${{ inputs.hobby_eligible }}
        run: |
          test "$FRONTEND_TARGET" = "vercel" || { echo "Azure frontend bloqueado: faltan infraestructura, ZIP standalone y startup comprobados."; exit 1; }
          test "$HOBBY_ELIGIBLE" = "true" || { echo "Confirmar elegibilidad Hobby antes de desplegar; no hay upgrade automatico."; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exigir CI aprobada para esta revision
        uses: actions/github-script@v8
        with:
          script: |
            const { assertSuccessfulCi } = await import(`${process.env.GITHUB_WORKSPACE}/apps/frontend/scripts/deploy-config.mjs`);
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', head_sha: context.sha,
              event: 'push', per_page: 100
            });
            assertSuccessfulCi(data.workflow_runs, context.sha);

  deploy:
    needs: preflight
    if: inputs.frontend_target == 'vercel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_USE_AZURE: ${{ inputs.target == 'azure' && 'true' || 'false' }}
      NEXT_PUBLIC_API_URL_RENDER: ${{ inputs.api_url_render }}
      NEXT_PUBLIC_API_URL_AZURE: ${{ inputs.api_url_azure }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      RELEASE_SHA: ${{ github.sha }}
      VERCEL_CLI_VERSION: '65.9.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: HUSKY=0 npm ci --ignore-scripts

      - name: Tests de configuracion
        run: npm run test:config --workspace=apps/frontend

      - name: Build shared
        run: npm run build:shared

      - name: Deploy a Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          node apps/frontend/scripts/deploy-config.mjs validate
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"
          node apps/frontend/scripts/deploy-config.mjs prepare
          npx --yes "vercel@$VERCEL_CLI_VERSION" build --prod --output .vercel/output --token="$VERCEL_TOKEN"
          npm run verify:public-build --workspace=apps/frontend
          node apps/frontend/scripts/deploy-config.mjs output
          url=$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          DEPLOYMENT_URL="$url" node apps/frontend/scripts/deploy-config.mjs published
          echo "Frontend: $url" >> "$GITHUB_STEP_SUMMARY"
