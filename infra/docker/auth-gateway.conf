server {
  listen 8080;
  location /auth/v1/ {
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    add_header Access-Control-Allow-Origin ${TS_FRONTEND_ORIGIN} always;
    add_header Access-Control-Allow-Headers "apikey, authorization, content-type, x-client-info, x-supabase-api-version" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://auth:9999/;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Plantillas de correo de Auth (infra/supabase/email-templates). GoTrue las descarga al enviar.
  location /email-templates/ {
    alias /usr/share/nginx/email-templates/;
    types { text/html html; }
    add_header Cache-Control "no-store" always;
  }
  location / {
    return 404;
  }
}
