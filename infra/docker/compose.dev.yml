name: turnosmart-local

services:
  postgres:
    image: postgres:16-alpine@sha256:890480b08124ce7f79960a9bb16fe39729aa302bd384bfd7c408fee6c8f7adb7
    environment:
      POSTGRES_USER: turnosmart_local
      POSTGRES_PASSWORD: turnosmart-local-db
      POSTGRES_DB: turnosmart_local
    ports:
      - '127.0.0.1:${TS_POSTGRES_PORT:-54325}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-local.sql:/docker-entrypoint-initdb.d/10-turnosmart.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -h, '127.0.0.1', -U, turnosmart_local, -d, turnosmart_local]
      interval: 10s
      start_period: 30s
      start_interval: 2s
      timeout: 3s
      retries: 30

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${TS_AUTH_PORT:-54326}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://turnosmart_local:turnosmart-local-db@postgres:5432/turnosmart_local?search_path=auth
      DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://localhost:${TS_FRONTEND_PORT:-3000}
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_JWT_SECRET: ${TS_JWT_SECRET:?run npm run docker:dev}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:9999/health']
      interval: 10s
      start_period: 30s
      start_interval: 2s
      timeout: 3s
      retries: 30

  auth-gateway:
    image: nginx:alpine@sha256:8b1e78743a03dbb2c95171cc58639fef29abc8816598e27fb910ed2e621e589a
    ports:
      - '127.0.0.1:${TS_AUTH_PORT:-54326}:8080'
    volumes:
      - ./auth-gateway.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      TS_FRONTEND_ORIGIN: http://localhost:${TS_FRONTEND_PORT:-3000}
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/auth/v1/health']
      interval: 10s
      start_period: 30s
      start_interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
