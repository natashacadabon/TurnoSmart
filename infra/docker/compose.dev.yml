services:
  # Un volumen existente oculta las dependencias de la imagen reconstruida.
  # Sincronizarlo una sola vez antes de iniciar los dos consumidores.
  dependencies:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    command: npm ci --include=dev
    environment:
      NODE_ENV: development
      HUSKY: '0'
    volumes:
      - ../..:/workspace
      - node_modules:/workspace/node_modules

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev

    container_name: turnosmart-frontend

    # shared se consume desde dist: se compila antes de levantar Next.
    command: >
      sh -c "npm run build:shared &&
      npm run dev --workspace=apps/frontend -- --hostname 0.0.0.0"

    ports:
      - '3000:3000'

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
      NEXT_PUBLIC_API_URL: http://localhost:4000

    volumes:
      - ../..:/workspace
      - node_modules:/workspace/node_modules
      - next_cache:/workspace/apps/frontend/.next

    depends_on:
      dependencies:
        condition: service_completed_successfully
      backend:
        condition: service_started

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev

    container_name: turnosmart-backend

    # Cliente de Prisma y shared compilados antes de arrancar (no estan en la imagen).
    command: >
      sh -c "npm run prisma:generate --workspace=apps/backend &&
      npm run dev:backend"

    ports:
      - '4000:4000'

    env_file:
      - ../../apps/backend/.env

    environment:
      NODE_ENV: development
      PORT: 4000

    volumes:
      - ../..:/workspace
      - node_modules:/workspace/node_modules

    depends_on:
      dependencies:
        condition: service_completed_successfully

volumes:
  node_modules:
  next_cache:
